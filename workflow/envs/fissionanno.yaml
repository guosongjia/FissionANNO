name: fissionanno
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # core runtime
  - python=3.11
  - pip

  # workflow engine — solver picks latest (currently snakemake 9.x)
  - snakemake-minimal

  # L1 lifton runtime helpers (lifton itself via pip in setup_env.sh)
  - liftoff
  - minimap2

  # L2 protein-to-genome alignment
  - miniprot

  # L3 UniRef50 filter
  - diamond

  # GFF / sequence handling
  - gffutils
  - biopython
  - samtools

  # tabular
  - pandas

  # config / build
  - pyyaml

  # NOTE: pyranges intentionally omitted — its old-pandas pin balloons
  # the solver. If interval ops are needed in L2/L3 conflict resolution
  # we'll add pyranges via pip in a follow-up env, or use a small
  # custom implementation against bedtools (already available via
  # bioconda) / pure pandas.

  # NOTE: lifton (and its broken `cigar` transitive dep, plus pytest
  # which lifton 1.0.2 imports at runtime) are installed by setup_env.sh
  # — NOT here. If you put them in this yaml, micromamba runs the pip
  # section before the cigar patch can be applied, and the install
  # fails. Run setup_env.sh from the repo root instead.

name: fissionanno
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # core runtime
  - python=3.11
  - pip

  # workflow engine — solver picks latest (currently snakemake 9.x)
  - snakemake-minimal

  # L1 lifton runtime helpers (lifton itself via pip below)
  - liftoff
  - minimap2

  # L2 protein-to-genome alignment
  - miniprot

  # L3 UniRef50 filter
  - diamond

  # GFF / sequence handling
  - gffutils
  - biopython
  - samtools

  # tabular
  - pandas

  # config / build
  - pyyaml

  # NOTE: pyranges intentionally omitted — its old-pandas pin balloons
  # the solver. If interval ops are needed in L2/L3 conflict resolution
  # we'll add pyranges via pip in a follow-up env, or use a small
  # custom implementation against bedtools (already available via
  # bioconda) / pure pandas.

  - pip:
    # Two-step manual install required for `cigar` (lifton's transitive
    # dep): the upstream tarball uses a broken `ez_setup.py` bootstrap.
    # Bootstrap path:
    #   cd /tmp && curl -sL https://files.pythonhosted.org/packages/source/c/cigar/cigar-0.1.3.tar.gz | tar xz
    #   cd cigar-0.1.3 && sed -i '/^import ez_setup/d; /^ez_setup.use_setuptools/d' setup.py
    #   pip install --no-build-isolation --no-deps .
    # then this yaml's pip section will succeed.
    - lifton==1.0.2
    # pytest is a lifton run-time import (its `liftoff/tests` package
    # imports `pytest` at module load); not declared in lifton's setup.
    - pytest
